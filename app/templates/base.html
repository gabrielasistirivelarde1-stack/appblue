<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}AppBlue{% endblock %}</title>
</head>
<body>
    <header>
        <h1>AppBlue</h1>
        <nav>
            <a href="{{ url_for('usuarios.lista_usuarios') }}">Usuarios</a> |
            <a href="{{ url_for('productos.lista_productos') }}">Productos</a> |
            <a href="{{ url_for('auth.login') }}">Login</a> |
            <a href="{{ url_for('admin.panel') }}">Admin</a> |
            <a href="{{ url_for('blog.entrada', id=1) }}">Blog</a>
        </nav>
        <hr>
    </header>

    <main>
        {% block contenido %}{% endblock %}
    </main>

    <footer>
        <hr>
        <p>AppBlue - Actividad de Blueprints</p>
    </footer>
</body>
</html>
